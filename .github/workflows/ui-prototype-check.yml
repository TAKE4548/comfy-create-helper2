name: UI Prototype Check

on:
  push:
    branches: [prototype/ui-review]
    paths:
      - 'ui-prototype/**'
      - 'frontend/**'
      - '.github/workflows/ui-prototype-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Install prototype dependencies
        run: npm install --no-audit --no-fund
        working-directory: ui-prototype
      - name: Build prototype
        run: npm run build
        working-directory: ui-prototype
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui-prototype
      - name: Browser verification
        run: npm run test:e2e
        working-directory: ui-prototype
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-prototype-playwright-results
          path: |
            ui-prototype/test-results/
            ui-prototype/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish discoverable artifact pointer
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const runId = context.runId
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: runId, per_page: 100
            })
            const artifact = data.artifacts.find(a => a.name === 'ui-prototype-playwright-results')
            const artifactUrl = artifact
              ? `https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${artifact.id}`
              : `https://github.com/${owner}/${repo}/actions/runs/${runId}`
            const report = [
              '## UI Prototype CI artifact',
              `- Run: [${runId}](https://github.com/${owner}/${repo}/actions/runs/${runId})`,
              artifact ? `- Artifact: [${artifact.id}](${artifactUrl})` : '- Artifact: not available',
              `- Commit: \`${context.sha}\``,
              `- Outcome: ${context.job === 'verify' ? 'see run result' : context.job}`,
            ].join('\\n')
            await core.summary.addRaw(report).write()
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.sha,
              state: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              context: 'ui-prototype/artifact',
              description: artifact ? `run=${runId} artifact=${artifact.id}` : `run=${runId} artifact=none`,
              target_url: artifactUrl
            })
